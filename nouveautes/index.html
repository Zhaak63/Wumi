<style>
:root{--bg:#110e0a;--bg-2:#17130d;--card:#1e1912;--line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.14);--text:#f7f1e8;--muted:#b9ab98;--dim:#85776a;--blue:#ff9d1b;--pink:#ffb547;--green:#3ddc97;--grad:linear-gradient(120deg,#ff8a00,#ff9d1b 35%,#ffbe5c 75%,#ffe2b0)}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--text);font:400 16px/1.6 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
.glow{position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(600px 400px at 15% -5%,rgba(255,157,27,.18),transparent 70%),radial-gradient(600px 400px at 90% 5%,rgba(255,190,92,.14),transparent 70%)}
header{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);background:rgba(17,14,10,.78);border-bottom:1px solid var(--line)}
nav{display:flex;align-items:center;gap:16px;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:-.02em}
.logo img{width:30px;height:30px}
.logo .dot{color:var(--pink)}
.nav-fin{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:10px;font-weight:600;font-size:14px;border:1px solid var(--line-2);background:rgba(255,255,255,.03);color:var(--text);cursor:pointer;font-family:inherit}
.btn.on{background:var(--blue);color:#110e0a;border-color:transparent}
.hero{padding:56px 0 26px}
.eyebrow{font-size:12.5px;letter-spacing:.14em;font-weight:600;color:var(--blue);text-transform:uppercase;margin-bottom:12px}
h1{font-size:clamp(34px,6vw,58px);line-height:1.05;letter-spacing:-.03em;font-weight:700}
.serif{font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-weight:400}
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:var(--muted);max-width:620px;margin-top:14px;font-size:17px}
.outils{display:flex;gap:10px;flex-wrap:wrap;margin:28px 0 8px;position:sticky;top:64px;z-index:10;background:var(--bg);padding:12px 0}
.outils input{flex:1 1 260px;min-width:0;background:var(--card);border:1px solid var(--line-2);border-radius:12px;padding:12px 14px;color:var(--text);font:inherit}
.outils input:focus{outline:2px solid rgba(255,157,27,.6)}
.filtres{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:24px}
.filtre{border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--muted);border-radius:99px;padding:6px 12px;font:inherit;font-size:13.5px;cursor:pointer}
.filtre.on{background:rgba(255,157,27,.16);color:var(--text);border-color:rgba(255,157,27,.4)}
h2{font-size:22px;letter-spacing:-.02em;margin:34px 0 12px;display:flex;gap:10px;align-items:center}
h2 small{color:var(--dim);font-size:14px;font-weight:500}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.cmd{border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,var(--card),var(--bg-2));padding:16px 18px}
.cmd .nom{font-family:ui-monospace,SFMono-Regular,monospace;font-size:15.5px;font-weight:600;color:var(--blue);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-family:Inter,sans-serif;font-size:11px;font-weight:600;letter-spacing:.04em;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.06);color:var(--muted)}
.cmd p{color:var(--muted);font-size:14.5px;margin-top:6px}
.cmd ul{list-style:none;margin-top:10px;border-top:1px solid var(--line);padding-top:8px;display:grid;gap:5px}
.cmd li{font-size:13.5px;color:var(--muted)}
.cmd li code{font-family:ui-monospace,monospace;color:var(--text);font-size:13px;margin-right:6px}
.vide{color:var(--dim);padding:40px 0;text-align:center}
footer{color:var(--dim);font-size:13px;padding:50px 0 40px;text-align:center}
footer a{color:var(--muted)}
@media (max-width:560px){.grille{grid-template-columns:1fr}.btn.ret{display:none}}

/* ---------- Theme clair (bouton soleil/lune, ou reglage de l'appareil) ---------- */
:root[data-theme="light"]{--bg:#fbf7f1;--bg-2:#f4eee5;--card:#ffffff;--card-2:#f6f0e6;--line:rgba(60,38,10,.09);--line-2:rgba(60,38,10,.16);--text:#221b10;--muted:#6b5a45;--dim:#8f7f6c;--blue:#b35c00;--pink:#d97400;--violet:#c76a00;--green:#0f9a63;--grad:linear-gradient(120deg,#b35c00,#d97400 45%,#ff9d1b 85%);color-scheme:light}
:root[data-theme="light"],:root[data-theme="light"] body{background:var(--bg)}
:root[data-theme="light"] header{background:rgba(245,247,253,.8)}
:root[data-theme="light"] .glow{background:radial-gradient(600px 400px at 15% -5%,rgba(179,92,0,.12),transparent 70%),radial-gradient(600px 400px at 90% 5%,rgba(217,116,0,.1),transparent 70%)}
:root[data-theme="light"] .page-grid,:root[data-theme="light"] .grid-bg{background-image:linear-gradient(rgba(60,38,10,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(60,38,10,.05) 1px,transparent 1px)}
:root[data-theme="light"] .btn-primary{color:#fff}
:root[data-theme="light"] .btn-primary:hover{box-shadow:0 10px 30px rgba(179,92,0,.35)}
:root[data-theme="light"] .btn-ghost,:root[data-theme="light"] .pill,:root[data-theme="light"] .lang{background:rgba(60,38,10,.03)}
:root[data-theme="light"] .btn-ghost:hover{background:rgba(60,38,10,.06)}
:root[data-theme="light"] .lang a.on{background:rgba(60,38,10,.08)}
:root[data-theme="light"] .lang svg{box-shadow:0 0 0 1px rgba(60,38,10,.18)}
:root[data-theme="light"] .mock{background:linear-gradient(180deg,#fff,var(--bg-2));box-shadow:0 40px 100px -40px rgba(179,92,0,.35),0 0 0 8px rgba(60,38,10,.03)}
:root[data-theme="light"] .mock-side .srv,:root[data-theme="light"] .stat,:root[data-theme="light"] .feat .ico{background:rgba(60,38,10,.035)}
:root[data-theme="light"] .mock-side a.on{background:rgba(179,92,0,.1)}
:root[data-theme="light"] .mock-chat{background:rgba(60,38,10,.025)}
:root[data-theme="light"] .mention{color:#3d47c9;background:rgba(88,101,242,.14)}
:root[data-theme="light"] .msg .cmd{background:rgba(179,92,0,.09)}
:root[data-theme="light"] .feat{background:linear-gradient(180deg,#fff,var(--card-2));box-shadow:0 1px 2px rgba(60,38,10,.04)}
:root[data-theme="light"] .feat:hover,:root[data-theme="light"] .tool:hover{box-shadow:0 14px 34px -18px rgba(60,38,10,.25)}
:root[data-theme="light"] .tool.big{background:linear-gradient(135deg,rgba(217,116,0,.1),rgba(179,92,0,.06) 60%,#fff);border-color:rgba(217,116,0,.25)}
:root[data-theme="light"] .tool:hover{border-color:rgba(217,116,0,.4)}
:root[data-theme="light"] .cta{background:radial-gradient(500px 260px at 20% 0%,rgba(179,92,0,.14),transparent 70%),radial-gradient(500px 260px at 80% 100%,rgba(217,116,0,.12),transparent 70%),#fff}
:root[data-theme="light"] .hero-mascot,:root[data-theme="light"] .cta .mascot{filter:none}
:root[data-theme="light"] .logo-mark,:root[data-theme="light"] .ava.wumi img,:root[data-theme="light"] .logo img{filter:none}
:root[data-theme="light"] .status::before{box-shadow:0 0 0 4px rgba(15,154,99,.15)}
:root[data-theme="light"] .tag[style*="ffbe50"]{color:#b06d00!important;background:rgba(255,170,40,.16)!important}
:root[data-theme="light"] .btn{background:rgba(60,38,10,.03)}
:root[data-theme="light"] .btn.on,:root[data-theme="light"] .btn-primary{background:var(--blue);color:#fff}
:root[data-theme="light"] .outils{background:var(--bg)}
:root[data-theme="light"] .filtre{background:rgba(60,38,10,.03)}
:root[data-theme="light"] .filtre.on{background:rgba(179,92,0,.12)}
:root[data-theme="light"] .badge{background:rgba(60,38,10,.06)}
:root[data-theme="light"] .cmd{box-shadow:0 1px 2px rgba(60,38,10,.04)}
.theme{display:grid;place-items:center;width:36px;height:36px;padding:0;border-radius:10px;border:1px solid var(--line-2);background:rgba(255,255,255,.03);color:var(--text);cursor:pointer;font-size:16px;line-height:1;flex:none}
.theme:hover{background:rgba(255,255,255,.07)}
:root[data-theme="light"] .theme{background:rgba(60,38,10,.03)}
:root[data-theme="light"] .theme:hover{background:rgba(60,38,10,.07)}
.theme .soleil{display:none}:root[data-theme="light"] .theme .soleil{display:block}:root[data-theme="light"] .theme .lune{display:none}
</style>
<style>
/* ---------- Nouveautés v3 ---------- */
.une{display:grid;grid-template-columns:1.15fr 1fr;gap:0;border:1px solid var(--line-2);border-radius:24px;overflow:hidden;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 16%,var(--card)),var(--bg-2) 70%);margin:10px 0 18px;position:relative}
.une-txt{padding:34px 34px 30px}
.une-pill{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);border:1px solid color-mix(in srgb,var(--c) 35%,transparent);padding:5px 12px;border-radius:99px}
.une-pill i{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 25%,transparent);font-style:normal}
.une h2{font-size:clamp(28px,4vw,42px);line-height:1.08;letter-spacing:-.03em;margin:16px 0 10px}
.une p{color:var(--muted);font-size:16.5px;max-width:460px}
.une-pts{display:grid;gap:10px;margin-top:22px}
.une-pt{display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-size:14.5px}
.une-pt span{font-size:20px;width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:color-mix(in srgb,var(--c) 14%,transparent);flex:none}
.une-pt code,.carte code{font-family:ui-monospace,monospace;font-size:13px;color:var(--blue)}
.une-vis{display:grid;place-items:center;padding:28px;background:radial-gradient(closest-side,color-mix(in srgb,var(--c) 28%,transparent),transparent);min-height:320px}
.une-vis img{max-width:100%;max-height:380px;border-radius:14px;filter:drop-shadow(0 24px 40px rgba(0,0,0,.35))}
.une-vis .gros{font-size:120px;filter:drop-shadow(0 20px 30px rgba(0,0,0,.3))}
.une-meta{margin-top:20px;color:var(--dim);font-size:13.5px}
.une-meta a{color:var(--text);border-bottom:1px solid var(--line-2)}
.recents{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:40px}
.carte{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--card);transition:.2s}
.carte:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--c) 45%,transparent)}
.carte-vis{height:120px;display:grid;place-items:center;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 30%,var(--card)),color-mix(in srgb,var(--c) 8%,var(--card)));font-size:52px;overflow:hidden}
.carte-vis img{width:100%;height:100%;object-fit:cover;object-position:center 42%}
.carte-txt{padding:16px 18px 18px}
.carte small{color:var(--dim);font-size:12.5px;font-weight:600;letter-spacing:.05em}
.carte h3{font-size:18px;letter-spacing:-.01em;margin:4px 0 6px}
.carte p{color:var(--muted);font-size:14px}
.barre{display:flex;gap:10px;align-items:center;margin:8px 0 22px;flex-wrap:wrap}
.barre h2{font-size:22px;letter-spacing:-.02em;margin-right:auto}
.barre input{flex:0 1 300px;min-width:0;background:var(--card);border:1px solid var(--line-2);border-radius:12px;padding:10px 14px;color:var(--text);font:inherit;font-size:14.5px}
.barre input:focus{outline:2px solid rgba(255,157,27,.5)}
.frise{position:relative;padding-left:34px}
.frise::before{content:"";position:absolute;left:11px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--line-2),transparent)}
.version{position:relative;border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,var(--card),var(--bg-2));padding:22px 24px;margin-bottom:14px;scroll-margin-top:90px}
.version::before{content:"";position:absolute;left:-29px;top:28px;width:12px;height:12px;border-radius:50%;background:var(--c,var(--blue));box-shadow:0 0 0 4px var(--bg),0 0 0 6px color-mix(in srgb,var(--c,var(--blue)) 40%,transparent)}
.version-tete{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.version-tete .num{font-family:ui-monospace,monospace;font-size:13px;font-weight:700;padding:3px 9px;border-radius:8px;background:color-mix(in srgb,var(--c,var(--blue)) 16%,transparent);color:var(--c,var(--blue))}
.version-tete h2{margin:0;font-size:20px;letter-spacing:-.02em}
.version-tete time{color:var(--dim);font-size:13.5px;margin-left:auto}
.version > p{color:var(--muted);margin:4px 0 12px}
.version h3{font-size:12.5px;margin:14px 0 8px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.version ul{margin:0;padding-left:0;list-style:none;display:grid;gap:7px}
.version li{color:var(--muted);font-size:15px;padding-left:18px;position:relative}
.version li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:2px;background:var(--c,var(--blue));opacity:.8}
.version li b{color:var(--text)}
.version code{font-family:ui-monospace,monospace;font-size:13.5px;color:var(--blue);background:rgba(255,157,27,.1);padding:1px 6px;border-radius:6px}
.version mark{background:rgba(255,205,74,.3);color:inherit;border-radius:3px}
:root[data-theme="light"] .une-pt{background:rgba(60,38,10,.03)}
@media (max-width:860px){.une{grid-template-columns:1fr}.une-vis{min-height:0;order:-1}.recents{grid-template-columns:1fr}.une-txt{padding:24px}}
@media (max-width:560px){.frise{padding-left:22px}.frise::before{left:5px}.version::before{left:-22px}.version-tete time{margin-left:0;width:100%}}
</style>

 {"v": "2.41", "date": "2026-11-25", "ico": "🌐", "couleur": "#ff9d1b", "en": {"titre": "The web player", "intro": "Control Wumi's music from your browser, on the dashboard.", "points": [["▶️", "Play, pause, skip, loop, volume"], ["🔎", "Search and add songs"], ["📜", "Reorder the queue"]], "blocs": [["Music", ["A <b>web player</b> on the dashboard: cover, progress bar, controls, search and the queue.", "Open to every member of the server, with the same rules as in Discord (same voice channel, DJ role). A <b>🌐 Web player</b> button is on the music panel."]]]}, "fr": {"titre": "Le lecteur web", "intro": "Pilote la musique de Wumi depuis ton navigateur, sur le tableau de bord.", "points": [["▶️", "Lecture, pause, suivant, boucle, volume"], ["🔎", "Cherche et ajoute des titres"], ["📜", "Gère la file d'attente"]], "blocs": [["Musique", ["Un <b>lecteur web</b> sur le tableau de bord : pochette, barre de progression, commandes, recherche et file d'attente.", "Ouvert à tous les membres du serveur, avec les mêmes règles que dans Discord (même salon vocal, rôle DJ). Un bouton <b>🌐 Lecteur web</b> est sur le panneau musique."]]]}},
 {"v": "2.40", "date": "2026-11-25", "ico": "📣", "couleur": "#ff9d1b", "en": {"titre": "Styled alerts and reviews", "intro": "Live and video alerts get a beautiful card, and you can now leave a review.", "points": [["📣", "A card for every Twitch, YouTube or TikTok alert"], ["⭐", "/review: rate Wumi"], ["🧡", "New Wumi head emojis"]], "blocs": [["Alerts", ["Each announcement now carries an image card in Wumi's colors: the thumbnail, a « LIVE » or « NEW VIDEO » badge, the channel, the title, the game and viewers."]], ["Reviews", ["<code>/review write</code>: a rating and a few words. Reviews are read before they appear on wumi.fr."]]]}, "fr": {"titre": "Alertes stylées et avis", "intro": "Les alertes de live et de vidéos ont une belle carte, et tu peux laisser un avis.", "points": [["📣", "Une carte pour chaque alerte Twitch, YouTube ou TikTok"], ["⭐", "/avis : note Wumi"], ["🧡", "Nouveaux emojis tête de Wumi"]], "blocs": [["Alertes", ["Chaque annonce porte maintenant une carte image aux couleurs de Wumi : la vignette, une pastille « EN DIRECT » ou « NOUVELLE VIDÉO », la chaîne, le titre, le jeu et les spectateurs."]], ["Avis", ["<code>/avis ecrire</code> : une note et quelques mots. Les avis sont relus avant d'apparaître sur wumi.fr."]]]}},
 {"v": "2.39", "date": "2026-11-25", "ico": "🧭", "couleur": "#ff9d1b", "en": {"titre": "A brand-new dashboard", "intro": "The dashboard gets a side menu with icons, and the whole website shares the same navigation.", "points": [["🧭", "Side menu with icons and a server switcher"], ["🔎", "Search your servers"], ["🌐", "Same header and footer on every page"]], "blocs": [["Dashboard", ["A <b>side menu</b> grouped into Overview, Modules and Tools, each with its icon; switch server right from the top of the menu.", "Server list with search, new login screen, and everything in Wumi's orange, in dark and light mode."]], ["Website", ["Features, Premium, Docs, Status, What's new and the legal pages now share <b>the same header and footer</b> as the home page."]]]}, "fr": {"titre": "Un tout nouveau tableau de bord", "intro": "Le tableau de bord passe à un menu latéral avec icônes, et tout le site partage la même navigation.", "points": [["🧭", "Menu latéral avec icônes et choix du serveur"], ["🔎", "Recherche dans tes serveurs"], ["🌐", "Même en-tête et pied de page partout"]], "blocs": [["Tableau de bord", ["Un <b>menu latéral</b> rangé en Vue d'ensemble, Modules et Outils, chacun avec son icône ; on change de serveur directement en haut du menu.", "Liste des serveurs avec recherche, nouvel écran de connexion, et tout aux couleurs orange de Wumi, en sombre comme en clair."]], ["Site", ["Fonctionnalités, Premium, Docs, Statut, Nouveautés et les pages légales ont maintenant <b>le même en-tête et le même pied de page</b> que l'accueil."]]]}},
 {"v": "2.38", "date": "2026-11-25", "img": "../og-wumi.jpg", "ico": "🧡", "couleur": "#ff9d1b", "en": {"titre": "A new face for Wumi", "intro": "Wumi gets its orange mascot: new avatar, new colors everywhere.", "points": [["🧡", "New logo and avatar"], ["🖼️", "Every banner redrawn"], ["🎴", "Orange rank, leaderboard and welcome cards"]], "blocs": [["Bot", ["New <b>avatar</b> and profile banner with the orange mascot.", "<code>/rank</code>, <code>/leaderboard</code>, economy, welcome and Wrapped cards take the new colors, with the mascot as a watermark. Embeds are orange too."]], ["Server", ["Every banner was redrawn: tickets, verification, rules, FAQ, suggestions, bugs, giveaways, modmail…"]], ["Website", ["wumi.fr switches to the logo's warm colors, with a new favicon and share image."]]]}, "fr": {"titre": "Wumi change de visage", "intro": "Wumi adopte sa mascotte orange : nouvel avatar, nouvelles couleurs partout.", "points": [["🧡", "Nouveau logo et nouvel avatar"], ["🖼️", "Toutes les bannières redessinées"], ["🎴", "Cartes rank, classement et bienvenue en orange"]], "blocs": [["Bot", ["Nouvel <b>avatar</b> et nouvelle bannière de profil avec la mascotte orange.", "Les cartes <code>/rank</code>, <code>/classement</code>, économie, bienvenue et Wrapped passent aux nouvelles couleurs, avec la mascotte en filigrane. Les embeds aussi sont orange."]], ["Serveur", ["Toutes les bannières sont redessinées : tickets, vérification, règlement, FAQ, idées, bugs, giveaways, modmail…"]], ["Site", ["wumi.fr passe aux couleurs chaudes du logo, avec un nouveau favicon et une nouvelle image de partage."]]]}},
 {"v": "2.37", "date": "2026-11-25", "ico": "🎮", "couleur": "#62e3ff", "en": {"titre": "Music games", "intro": "Three new games to play together in voice, next to the blind test.", "points": [["⚡", "Music quiz: the faster, the more points"], ["🕵️", "Who picked it? Guess who chose the song"], ["🌡️", "Vibe check: rate it and match the room"]], "blocs": [["Music", ["<code>/musicgame quiz</code>: a snippet, 4 titles, one answer each. Faster answers score more (1000 → 300), streaks add up to +500.", "<code>/musicgame who-picked</code>: everyone secretly adds 1 to 3 songs, then the voice channel guesses who picked each one.", "<code>/musicgame vibe-check</code>: rate each song from 1 to 10; the closer to the room's average, the more points. A « hot take » for the boldest opinion."]]]}, "fr": {"titre": "Les jeux musicaux", "intro": "Trois nouveaux jeux à faire ensemble en vocal, à côté du blind test.", "points": [["⚡", "Quiz musical : plus tu es rapide, plus tu marques"], ["🕵️", "Qui l'a choisie ? Devine qui a mis le titre"], ["🌡️", "Vibe check : note et colle à l'avis du vocal"]], "blocs": [["Musique", ["<code>/jeu-musical quiz</code> : un extrait, 4 titres, une réponse chacun. Plus on répond vite, plus on marque (1000 → 300), et une série ajoute jusqu'à +500.", "<code>/jeu-musical qui-l-a-choisie</code> : chacun propose en secret 1 à 3 titres, puis le vocal devine qui a choisi chaque titre.", "<code>/jeu-musical vibe-check</code> : on note chaque titre de 1 à 10 ; plus on est proche de la moyenne du vocal, plus on marque. Un « hot take » pour l'avis le plus osé."]]]}},

             ["Website", ["<b>Server banner</b>: turn on <code>/config</code> › Community › <b>Show on wumi.fr</b> and your server (name, icon, members) scrolls on the home page. Off by default.", "New <b>legal notice</b>, <b>refund policy</b> and <b>copyright</b> pages; the terms now cover Premium."]]]},

             ["Site", ["<b>Banderole des serveurs</b> : active <code>/config</code> › Communauté › <b>Afficher sur wumi.fr</b> et ton serveur (nom, icône, membres) défile sur la page d'accueil. Désactivé par défaut.", "Nouvelles pages <b>mentions légales</b>, <b>remboursement</b> et <b>droits d'auteur</b> ; les conditions couvrent maintenant Premium."]]]}},

 {"v": "2.34", "date": "2026-11-25", "img": {"en": "../assets/apercus/carte-en.webp", "fr": "../assets/apercus/carte-fr.webp"}, "ico": "🎴", "couleur": "#bf9bff",

   "blocs": [["Cards", ["<code>/cards open</code>: an animated booster of 5 cards, from the least to the most rare. 1 in 40 chance of a <b>shiny</b> card.", "Boosters come from chatting (one every 100 messages), a free daily one, or the server's shop.", "<code>/cards binder</code>, <code>/cards showcase</code>, <code>/cards leaderboard</code>. No trading or gifting, on purpose: duplicates are recycled into dust."]]]},
  "fr": {"titre": "Les cartes à collectionner", "intro": "72 créatures à collectionner, à ouvrir en boosters et à montrer dans ton classeur.",

 {"v": "2.33", "date": "2026-11-21", "ico": "💡", "couleur": "#ffcd4a",
  "en": {"titre": "A FAQ that understands", "intro": "The FAQ now understands the meaning of a question, not just its keywords.",
   "points": [["🧠", "Matches by meaning, in 6 languages"], ["🎫", "Answers right when a ticket opens"]],
   "blocs": [["FAQ", ["An AI model running on Wumi's own server compares the <b>meaning</b> of a question with your FAQ entries: \"the bot stopped replying\" finds \"Wumi doesn't work\", and an English question finds a French entry."]],
             ["Tickets", ["When a ticket opens, the matching FAQ entry is posted with two buttons: <b>Solved</b> or <b>Wait for the team</b>. Setting in <code>/config</code>, on by default."]]]},
  "fr": {"titre": "Une FAQ qui comprend", "intro": "La FAQ comprend maintenant le sens d'une question, pas seulement ses mots-clés.",
   "points": [["🧠", "Trouve par le sens, en 6 langues"], ["🎫", "Répond dès l'ouverture d'un ticket"]],
   "blocs": [["FAQ", ["Un modèle d'IA, sur le serveur de Wumi, compare le <b>sens</b> d'une question avec tes fiches : « le bot répond plus » trouve « Wumi ne marche pas », et une question en anglais trouve une fiche en français."]],
             ["Tickets", ["À l'ouverture d'un ticket, la fiche qui correspond est postée avec deux boutons : <b>C'est réglé</b> ou <b>J'attends l'équipe</b>. Réglage dans <code>/config</code>, activé par défaut."]]]}},
 {"v": "2.32", "date": "2026-11-20", "ico": "🤖", "couleur": "#7b9bff", "en": {"intro": "AI comes to Wumi: scam detection, toxic message filter, NSFW image detection and message translation. Everything runs on Wumi's own server.", "blocs": [["Automod", ["<b>Anti-scam</b>, on by default: fake Nitro, fake Steam gifts, “I reported you by mistake, contact the staff”, fake crypto airdrops, and links that imitate Discord or Steam (dlscord, steamcommunlty…). In all 6 languages.", "<b>AI toxicity filter</b>: an AI reads messages and removes insults and harassment, even misspelled, in any language. The log shows how confident it was.", "<b>NSFW image detection</b>: explicit images are removed. NSFW channels are left alone, and the image is never copied into the logs.", "Turn them on with <code>/automod module</code> or from <code>/config</code>. Both AI modules are off by default."]], ["Translation", ["Right-click a message › Apps › <b>Translate</b>: Wumi translates it into your Discord language. Only you can see the reply.", "French, English, Spanish, German, Portuguese and Italian."]], ["Privacy", ["The AI models run on Wumi's own server: no message and no image is ever sent to an outside service."]]]}, "fr": {"intro": "L'IA arrive sur Wumi : détection des arnaques, filtre des messages toxiques, détection des images NSFW et traduction des messages. Tout tourne sur le serveur de Wumi.", "blocs": [["Automod", ["<b>Anti-arnaques</b>, actif par défaut : faux Nitro, faux cadeaux Steam, « je t'ai signalé par erreur, contacte le staff », faux airdrops crypto, et les liens qui imitent Discord ou Steam (dlscord, steamcommunlty…). Dans les 6 langues.", "<b>Anti-toxicité par IA</b> : une IA lit les messages et supprime les insultes et le harcèlement, même mal écrits, dans toutes les langues. Le log indique son niveau de certitude.", "<b>Détection des images NSFW</b> : les images explicites sont supprimées. Les salons NSFW ne sont pas concernés, et l'image n'est jamais recopiée dans les logs.", "À activer avec <code>/automod module</code> ou depuis <code>/config</code>. Les deux modules IA sont désactivés par défaut."]], ["Traduction", ["Clic droit sur un message › Applications › <b>Traduire</b> : Wumi le traduit dans ta langue Discord. Réponse visible de toi seul.", "Français, anglais, espagnol, allemand, portugais et italien."]], ["Confidentialité", ["Les modèles d'IA tournent sur le serveur de Wumi : aucun message ni aucune image n'est envoyé à un service externe."]]]}},
{"v": "2.31", "en": {"intro": "Wumi now speaks Spanish, German, Portuguese (Brazil) and Italian.", "blocs": [["Languages", ["Pick your server's language in <code>/setup</code> or <code>/config</code> → Server. A server whose Discord language is one of these gets it automatically.", "<b>Everything is translated</b>: messages, buttons, menus, image cards, logs, tickets, giveaways, events, anti-raid, anti-nuke, automod, economy, games and more.", "Command descriptions <b>and option choices</b> follow each member's Discord language."]], ["Games", ["The quiz's 65 questions and the country names of the flag round, in every language.", "Hangman has its own word list for each language."]]]}, "fr": {"intro": "Wumi parle maintenant espagnol, allemand, portugais (Brésil) et italien.", "blocs": [["Langues", ["Choisis la langue de ton serveur dans <code>/demarrer</code> ou <code>/config</code> → Serveur. Un serveur dont la langue Discord est l'une de celles-ci la reçoit d'office.", "<b>Tout est traduit</b> : messages, boutons, menus, cartes image, journaux, tickets, concours, événements, anti-raid, anti-nuke, automod, économie, jeux et le reste.", "Les descriptions des commandes <b>et les choix des options</b> suivent la langue Discord de chaque membre."]], ["Jeux", ["Les 65 questions du quiz et les noms des pays de la manche drapeaux, dans chaque langue.", "Le pendu a sa propre liste de mots pour chaque langue."]]]}},
 {"v": "2.28", "en": {"intro": "Boosts deserve a card too.", "blocs": [["Boosts", ["A boost is now announced like a level-up: the thank-you message, then an image card with the booster's avatar in a pink ring, the server's boost count, a bar to the next tier and the unlocked role.", "<code>/boost test</code>: a private preview of the announcement, no real boost needed."]]]}, "fr": {"intro": "Les boosts ont droit à leur carte.", "blocs": [["Boosts", ["Un boost s'annonce maintenant comme une montée de niveau : le remerciement, puis une carte image avec l'avatar du booster dans un anneau rose, le nombre de boosts du serveur, une barre vers le palier suivant et le rôle débloqué.", "<code>/boost test</code> : un aperçu privé de l'annonce, sans attendre un vrai boost."]]]}},
 {"v": "2.26", "en": {"intro": "Instagram announcements for any public creator or business account.", "blocs": [["Announcements", ["<code>/watch</code> Instagram now follows <b>any public Creator or Business account by its @username</b>. Nothing to set up on your side.", "Wumi emojis no longer show up as raw code in the author line or footer of announcements and logs."]]]}, "fr": {"intro": "Les annonces Instagram pour n'importe quel compte créateur ou entreprise.", "blocs": [["Annonces", ["<code>/veille</code> Instagram suit maintenant <b>n'importe quel compte public Créateur ou Entreprise par son @pseudo</b>. Rien à configurer de ton côté.", "Les emojis de Wumi ne s'affichent plus en code brut dans la ligne d'auteur ou le pied des annonces et des journaux."]]]}},
 {"v": "2.25", "en": {"intro": "New emojis, themed level-up cards and a smarter dashboard.", "blocs": [["Design", ["A brand-new set of Wumi emojis, one color per meaning (green for success, red for errors, gold for economy...).", "The level-up card follows the card theme (the member's, or the server's): accent, ring, bar and background tint."]], ["Dashboard", ["Your server list fills in live with every server where Wumi is and you can manage it.", "The Premium tab previews both the rank card and the level-up card with your server's theme and background."]]]}, "fr": {"intro": "De nouveaux emojis, des cartes de niveau à thème et un tableau de bord plus malin.", "blocs": [["Design", ["Un tout nouveau jeu d'emojis Wumi, une couleur par sens (vert réussite, rouge erreur, or économie...).", "La carte de montée de niveau suit le thème de carte (celui du membre, sinon celui du serveur) : accent, anneau, barre et teinte du fond."]], ["Tableau de bord", ["La liste de tes serveurs se complète en direct avec tous ceux où Wumi est présent et que tu peux gérer.", "L'onglet Premium montre la carte de rang et la carte de niveau avec le thème et le fond de ton serveur."]]]}},
 {"v": "2.24", "en": {"intro": "A free Premium trial, Wumi fully in English, and a Premium tab in the dashboard.", "blocs": [["Premium", ["<b>7-day free Premium trial</b>: <code>/premium trial</code> or the button in the welcome message. Once per server, no card needed, with a DM the day before it ends.", "Dashboard Premium tab: subscription status, start the trial, upload the server's card background with a preview, and a default card theme for the whole server."]], ["English", ["Cards, charts, suggestions, appeals, automod, history, FAQ and announcements are now fully in English, and commands show in British English too.", "New welcome message with a Set up Wumi button."]]]}, "fr": {"intro": "Un essai Premium gratuit, Wumi vraiment en anglais, et un onglet Premium au tableau de bord.", "blocs": [["Premium", ["<b>Essai Premium gratuit de 7 jours</b> : <code>/premium essai</code> ou le bouton du message d'arrivée. Une fois par serveur, sans carte, avec un MP la veille de la fin.", "Onglet Premium du tableau de bord : état de l'abonnement, lancer l'essai, envoyer le fond des cartes du serveur avec aperçu, et un thème de carte par défaut pour tout le serveur."]], ["Anglais", ["Cartes, graphiques, suggestions, appels, automod, historique, FAQ et annonces sont maintenant entièrement en anglais, et les commandes s'affichent aussi en anglais britannique.", "Nouveau message d'arrivée avec un bouton Configurer Wumi."]]]}},
 {"v": "2.23", "en": {"intro": "Vote reminders, vote streaks and a complete /setup.", "blocs": [["Votes", ["<b>Remind me</b> button in <code>/vote</code>: a DM as soon as you can vote again.", "<b>Vote streaks</b>: voting again within 36 hours keeps your streak, and each streak vote adds 1 hour to your XP bonus (up to +12 h)."]], ["Setup", ["<code>/setup</code> now covers 9 steps (language, welcome, auto role, logs, AutoMod, anti-raid, levels, level-up channel, economy) with a progress bar."]]]}, "fr": {"intro": "Rappels de vote, séries de votes et un /demarrer complet.", "blocs": [["Votes", ["Bouton <b>Me rappeler</b> dans <code>/vote</code> : un MP dès que tu peux revoter.", "<b>Séries de votes</b> : revoter dans les 36 h garde ta série, et chaque vote de série ajoute 1 h à ton bonus d'XP (jusqu'à +12 h)."]], ["Configuration", ["<code>/demarrer</code> couvre maintenant 9 étapes (langue, bienvenue, rôle automatique, journaux, AutoMod, anti-raid, niveaux, salon des montées de niveau, économie) avec une barre de progression."]]]}},
 {"v":"2.22","en":{"intro":"Wumi Premium: new extras for the servers that support Wumi. Everything free stays free.","blocs":[["Premium",["<code>/premium info</code> is redesigned: exclusives, higher limits and a subscribe button straight from Discord.","<b>4 exclusive card themes</b> (Aurora, Neon, Sakura, Emerald), free for every member of a premium server in <code>/theme</code>.","<code>/premium card-background</code>: one background for the rank, profile and level-up cards of the whole server. Members' own backgrounds still come first.","<code>/premium bot</code>: Wumi's name, avatar, banner and bio, for your server only."]]]},"fr":{"intro":"Wumi Premium : de nouveaux bonus pour les serveurs qui soutiennent Wumi. Tout ce qui est gratuit le reste.","blocs":[["Premium",["<code>/premium info</code> est refait : exclusivités, plafonds relevés et bouton d'abonnement directement dans Discord.","<b>4 thèmes de carte exclusifs</b> (Aurore, Néon, Sakura, Émeraude), offerts à tous les membres d'un serveur premium dans <code>/theme</code>.","<code>/premium fond-cartes</code> : un fond pour les cartes de rang, de profil et de montée de niveau de tout le serveur. Les fonds perso des membres restent prioritaires.","<code>/premium bot</code> : le nom, l'avatar, la bannière et la bio de Wumi, rien que sur ton serveur."]]]}},
 {"v":"2.21","en":{"intro":"A weekly challenge for Wumi Run, coins you can spend, and clearer sanctions.","blocs":[["Wumi Run",["<b>Weekly challenge</b>: one level per week, every finished run counts (not just records). Live leaderboard in the channel of your choice, podium rewarded every Monday. <code>/wumirun challenge</code> to see your rank.","<code>/wumirun convert</code>: turn your game coins into your server's currency, at the rate the server picks."]],["Moderation",["Warn, mute, kick and ban receipts now show the member's avatar, the moderator, the reason, the duration and the case number, with a color for each level."]],["Reliability",["Daily encrypted backups sent off the machine, and updates that roll back on their own if something goes wrong."]]]},"fr":{"intro":"Un défi de la semaine pour Wumi Run, des pièces qui servent, et des sanctions plus claires.","blocs":[["Wumi Run",["<b>Défi de la semaine</b> : un niveau par semaine, chaque partie terminée compte (pas seulement les records). Classement en direct dans le salon de ton choix, podium récompensé chaque lundi. <code>/wumirun defi</code> pour voir ta place.","<code>/wumirun convertir</code> : transforme tes pièces du jeu en monnaie du serveur, au taux choisi par le serveur."]],["Modération",["Les reçus d'avertissement, de mute, d'expulsion et de bannissement montrent l'avatar du membre, le modérateur, la raison, la durée et le numéro de dossier, avec une couleur par gravité."]],["Fiabilité",["Sauvegardes chiffrées envoyées hors de la machine chaque jour, et mises à jour qui reviennent en arrière toutes seules en cas de souci."]]]}},
 {"v":"2.20","en":{"intro":"New emojis everywhere.","blocs":[["Emojis",["72 redrawn emojis: gradient tiles, bold white icons and one color per family (green for success, red for moderation, gold for economy, purple for progress...). Gold, silver and bronze medals, and music finally gets its own."]]]},"fr":{"intro":"De nouveaux emojis partout.","blocs":[["Emojis",["72 emojis redessinés : tuiles en dégradé, pictogrammes blancs bien lisibles et une couleur par famille (vert réussite, rouge modération, or économie, violet progression...). Médailles or, argent et bronze, et la musique a enfin le sien."]]]}},
 {"v":"2.19","en":{"intro":"Level-ups in style.","blocs":[["Levels",["Level-up announcements become an image card: avatar in a glowing ring, \"9 → 10\" in big numbers, a bar to the next level, rank, bonus and unlocked roles. The color changes with the tier, from blue to diamond.","Voice level-ups get the same card. Only the member is pinged, never the roles."]]]},"fr":{"intro":"Les montées de niveau ont du style.","blocs":[["Niveaux",["Les annonces de montée de niveau deviennent une carte image : avatar dans un anneau lumineux, « 9 → 10 » en grand, barre vers le niveau suivant, rang, bonus et rôles débloqués. La couleur change avec le palier, du bleu au diamant.","Les montées de niveau en vocal ont la même carte. Seul le membre est notifié, jamais les rôles."]]]}},
 {"v":"2.18","en":{"intro":"Your data, encrypted.","blocs":[["Privacy",["Everything members write and Wumi keeps (reports, suggestions, tickets, sanction reasons, staff notes...) is now encrypted at rest with AES-256-GCM."]]]},"fr":{"intro":"Tes données, chiffrées.","blocs":[["Confidentialité",["Tout ce que les membres écrivent et que Wumi garde (signalements, suggestions, tickets, raisons de sanction, notes du staff...) est désormais chiffré au repos en AES-256-GCM."]]]}},
 {"v":"2.17","en":{"intro":"The economy gets a full redesign, with the Wumi Run gold coin as its new currency.","blocs":[["Economy",["<code>/economy daily</code> and <code>/economy work</code> now show an image card: your gain in big numbers, your streak bonus, a 10-day streak bar and your new balance. Wumi also tells you exactly when you can come back.","<code>/economy balance</code> becomes a wallet card: total wealth, wallet, bank, total earned, rank, streak and whether your daily reward is ready.","Quick buttons under every answer: Daily, Work, Wallet, Leaderboard. No need to retype a command.","<code>/economy leaderboard</code> is now an image like <code>/leaderboard</code>, with gold bars and page buttons.","<code>/bank view</code> shows the wallet card with your interest, and <code>/pay</code> shows a receipt with the recipient's avatar."]],["Currency",["The Wumi Run gold coin is the new default currency icon, everywhere: balances, shop, bank, missions, profile card.","Custom currency emoji: typing <code>:Name:</code> now finds the emoji on your server. A broken emoji falls back to the coin, and <code>default-emoji</code> brings the coin back."]]]},"fr":{"intro":"L'économie est entièrement refaite, avec la pièce d'or de Wumi Run comme nouvelle monnaie.","blocs":[["Économie",["<code>/economie daily</code> et <code>/economie travailler</code> affichent une carte image : ton gain en grand, ton bonus de série, une barre de série sur 10 jours et ton nouveau solde. Wumi te dit aussi exactement quand revenir.","<code>/economie solde</code> devient une carte portefeuille : fortune totale, poche, banque, total gagné, rang, série et récompense du jour prête ou non.","Des boutons rapides sous chaque réponse : Récompense, Travailler, Portefeuille, Classement. Plus besoin de retaper une commande.","<code>/economie classement</code> passe en image comme <code>/classement</code>, avec des barres dorées et des boutons de pages.","<code>/banque voir</code> reprend la carte portefeuille avec tes intérêts, et <code>/payer</code> affiche un reçu avec l'avatar du destinataire."]],["Monnaie",["La pièce d'or de Wumi Run devient l'icône de monnaie par défaut, partout : soldes, boutique, banque, missions, carte de profil.","Emoji de monnaie personnalisé : taper <code>:Nom:</code> retrouve maintenant l'emoji sur ton serveur. Un emoji cassé est remplacé par la pièce, et <code>emoji-defaut</code> la remet."]]]}},
 {"v":"2.16","en":{"intro":"Wumi now has its own game: Wumi Run, a platformer you play right inside Discord.","blocs":[["Wumi Run",["<code>/wumirun play</code> launches the game in the channel, as a Discord Activity. Nothing to install, it works on desktop and mobile.","5 levels (from First steps to The Citadel), coins to collect, stars to earn and characters to unlock in the shop.","Your progress is saved on your Discord account and follows you from one server to another."]],["On your server",["<code>/wumirun leaderboard</code>: the server's best times on each level, as an image.","<code>/wumirun profile</code>: levels cleared, times, stars and rank.","First clear of a level on a server: XP and server currency (can be turned off). New records can be announced in a channel with <code>/wumirun config</code>."]]]},"fr":{"intro":"Wumi a maintenant son propre jeu : Wumi Run, un jeu de plateforme qui se joue directement dans Discord.","blocs":[["Wumi Run",["<code>/wumirun jouer</code> lance le jeu dans le salon, en Activité Discord. Rien à installer, ça marche sur ordinateur et sur téléphone.","5 niveaux (de Premiers pas à La citadelle), des pièces à ramasser, des étoiles à gagner et des personnages à débloquer dans la boutique.","Ta progression est enregistrée sur ton compte Discord et te suit d'un serveur à l'autre."]],["Sur ton serveur",["<code>/wumirun classement</code> : les meilleurs temps du serveur sur chaque niveau, en image.","<code>/wumirun profil</code> : niveaux terminés, temps, étoiles et rang.","Première victoire sur un niveau dans un serveur : XP et monnaie du serveur (désactivable). Les nouveaux records peuvent être annoncés dans un salon avec <code>/wumirun config</code>."]]]}},
 {"v":"2.14","en":{"intro":"Translated server logs, a better temporary voice panel, right-click sanctions and recurring events.","blocs":[["Logs",["All server logs are now in your server's language, and each entry shows <b>who</b> did the action, with their avatar and a Profile or View message button."]],["Moderation",["Right-click a member › Apps › <b>Sanction</b>, or a message › <b>Sanction author</b>: their record, the action (warn, mute, kick, ban), a ready-made reason, and the message deleted in one click."]],["Temporary voice",["New control panel: rename, slots, lock, hide, claim, plus menus to invite, kick or hand over the channel."]],["Events",["<code>/event</code> can repeat (daily, weekly, every 2 weeks, monthly) and is added to the server's native Discord events.","<code>/leaderboard</code> is now an image: avatars, gold, silver and bronze ranks, progress bars and your own rank at the bottom."]]]},"fr":{"intro":"Journaux traduits, un meilleur panneau de vocal temporaire, la sanction au clic droit et les événements récurrents.","blocs":[["Journaux",["Tous les journaux du serveur sont maintenant dans la langue du serveur, et chaque fiche indique <b>qui</b> a fait l'action, avec son avatar et un bouton Profil ou Voir le message."]],["Modération",["Clic droit sur un membre › Applications › <b>Sanctionner</b>, ou sur un message › <b>Sanctionner l'auteur</b> : son casier, l'action (avertir, muet, expulser, bannir), une raison prête, et le message supprimé en un clic."]],["Vocal temporaire",["Nouveau panneau de contrôle : renommer, places, verrouiller, cacher, revendiquer, et des menus pour inviter, expulser ou donner le salon."]],["Événements",["<code>/event</code> peut se répéter (chaque jour, semaine, 2 semaines, mois) et s'ajoute aux événements Discord du serveur.","<code>/classement</code> passe en image : avatars, rangs or, argent et bronze, barres de progression et ta place en bas."]]]}},
 {"v":"2.13","en":{"intro":"Smarter tickets, a new /embed builder, bonus chances in giveaways and custom welcome cards.","blocs":[["Tickets",["The first staff reply automatically claims a free ticket. New Release button, an alert when a ticket stays unanswered, and <code>/ticket stats</code> with response times and a staff ranking."]],["/embed",["Rebuilt from scratch: banner, thumbnail, up to 5 sections, image, link buttons and role mention, with an exact preview. Drafts are kept 24 hours, and you can save your own templates."]],["Giveaways",["New look with a live entry count, and <b>bonus chances</b> for a role or for boosters (x2 to x10). Winners get a DM."]],["Cards",["<code>/serverinfo</code> and <code>/userinfo</code> are now image cards.","Custom welcome cards: up to 5 designs with your own background, style, colour and text, picked at random or fixed."]]]},"fr":{"intro":"Des tickets plus malins, un nouveau /embed, des chances bonus aux concours et des cartes de bienvenue personnalisées.","blocs":[["Tickets",["La première réponse du staff prend automatiquement un ticket libre. Nouveau bouton Libérer, une alerte quand un ticket reste sans réponse, et <code>/ticket stats</code> avec les temps de réponse et le classement de l'équipe."]],["/embed",["Entièrement refait : bannière, vignette, jusqu'à 5 sections, image, boutons lien et mention d'un rôle, avec un aperçu exact. Brouillons gardés 24 h, et tu peux enregistrer tes propres modèles."]],["Concours",["Nouvelle présentation avec le nombre de participants en direct, et des <b>chances bonus</b> pour un rôle ou les boosters (x2 à x10). Les gagnants reçoivent un MP."]],["Cartes",["<code>/serverinfo</code> et <code>/userinfo</code> deviennent des cartes en image.","Cartes de bienvenue personnalisées : jusqu'à 5 designs avec ton fond, ton style, ta couleur et ton texte, tirés au hasard ou fixes."]]]}},
 {"v":"2.12","en":{"intro":"Protection against rogue admins, server structure import, and a weekly stats report.","blocs":[["Anti-nuke",["<code>/antinuke</code> (server owner only): if an admin or a bot deletes channels or roles, or bans in a burst, Wumi removes their roles right away and tells you how to put everything back."]],["Structure",["<code>/structure import</code>: import a structure file, even from another server, to copy its roles, channels and permissions. Nothing is applied until you confirm."]],["Stats",["<code>/stats server</code> compares with the previous period and shows peak hours.","<code>/stats report</code>: every Monday at 9 am, the week's summary in the channel of your choice."]]]},"fr":{"intro":"Une protection contre les admins malveillants, l'import de structure, et un rapport de stats chaque semaine.","blocs":[["Anti-nuke",["<code>/antinuke</code> (propriétaire du serveur uniquement) : si un admin ou un bot supprime des salons ou des rôles, ou bannit en rafale, Wumi lui retire ses rôles aussitôt et t'explique comment tout remettre en place."]],["Structure",["<code>/structure importer</code> : importe un fichier de structure, même d'un autre serveur, pour copier ses rôles, salons et permissions. Rien n'est appliqué avant ta confirmation."]],["Stats",["<code>/stats serveur</code> compare avec la période précédente et montre les heures de pointe.","<code>/stats rapport</code> : chaque lundi à 9 h, le bilan de la semaine dans le salon de ton choix."]]]}},
 { v: '2.11.4',
   en: { intro: 'A docs command, a nicer vote screen, and a fix for very high XP.', blocs: [
     ['New', ['<code>/docs</code>: the full command list on wumi.fr in one click. Add <code>command:</code> to open a specific command directly.', '<code>/vote</code> got a makeover: a banner, why voting helps, your status with a 12-hour gauge, your total and your rank among voters.']],
     ['Support server', ['New "Share an idea" panel: one button, a short form, and your idea becomes a suggestion the community can vote on.', 'New "Report a bug" panel: reports go straight to the team, and you get a DM when your bug is confirmed or fixed.']],
     ['Fixed', ['A member with an extremely high XP total could break <code>/leaderboard</code> and XP gains. XP is now capped at one billion.']] ] },
   fr: { intro: 'Une commande de documentation, un écran de vote plus beau, et un correctif pour les XP démesurées.', blocs: [
     ['Nouveau', ['<code>/doc</code> : la liste complète des commandes sur wumi.fr en un clic. Ajoute <code>commande:</code> pour ouvrir directement une commande.', '<code>/voter</code> fait peau neuve : une bannière, pourquoi voter, ton statut avec une jauge des 12 heures, ton total et ton rang parmi les votants.']],
     ['Serveur support', ['Nouveau panneau « Propose une idée » : un bouton, un petit formulaire, et ton idée devient une suggestion que la communauté peut voter.', 'Nouveau panneau « Signale un bug » : les rapports arrivent directement chez l\'équipe, et tu reçois un MP quand ton bug est confirmé ou corrigé.']],
     ['Corrigé', ['Un membre avec un total d\'XP démesuré pouvait bloquer <code>/classement</code> et les gains d\'XP. L\'XP est maintenant plafonnée à un milliard.']] ] } },
 { v: '2.11.2',
   en: { intro: 'Everyone can now pick up the Christmas snow, the staff recruitment panel gets a makeover, and Wumi lands on TikTok.', blocs: [
     ['Christmas event', ['When snow falls, <b>everyone</b> has 30 seconds to click Pick up, once per snowfall. Each player gets their own surprise (☃️ +1, 🎁 +3 or 🧦 −1), and the first one gets a +1 bonus.', 'The message shows live who found what, and keeps the recap once the snow melts.']],
     ['Recruitment', ['New application panel with a banner, open positions and a 3-step guide.', 'Choose the panel language (English or French): the form, the confirmation and the reply DM follow it.']],
     ['Wumi on TikTok', ['A new video every day: tips, commands and Discord memes. Follow <a href="https://www.tiktok.com/@wumi.fr" target="_blank" rel="noopener">@wumi.fr</a>!']] ] },
   fr: { intro: 'Tout le monde peut ramasser la neige de Noël, le panneau de recrutement fait peau neuve, et Wumi débarque sur TikTok.', blocs: [
     ['Événement de Noël', ['Quand la neige tombe, <b>tout le monde</b> a 30 secondes pour cliquer sur Ramasser, une fois par chute. Chacun tire sa propre surprise (☃️ +1, 🎁 +3 ou 🧦 −1), et le premier gagne +1 de bonus.', 'Le message affiche en direct qui a trouvé quoi, et garde le récapitulatif quand la neige fond.']],
     ['Recrutement', ['Nouveau panneau de candidatures avec bannière, postes ouverts et déroulé en 3 étapes.', 'Choisis la langue du panneau (français ou anglais) : le formulaire, la confirmation et la réponse en MP la suivent.']],
     ['Wumi sur TikTok', ['Une vidéo chaque jour : astuces, commandes et mèmes Discord. Abonne-toi à <a href="https://www.tiktok.com/@wumi.fr" target="_blank" rel="noopener">@wumi.fr</a> !']] ] } },
 { v: '2.11',
   en: { intro: 'Christmas comes to the official Wumi server, plus a handy tool for moderators.', blocs: [
     ['Christmas event', ['On the official Wumi server until December 31: chat in the community channels and something falls from the snow. Pick it up first to find a ☃️ snowman (+1), a 🎁 gift (+3)… or an old 🧦 sock (−1)!', 'Live leaderboard with <code>/christmas leaderboard</code>, and a podium announced at the end.']],
     ['Moderation', ['<code>/snipe</code>: the latest deleted or edited messages in a channel, kept for 10 minutes in memory only, visible to staff.']],
     ['Fixed', ['Voice time is now counted every 5 minutes and survives bot restarts; a muted mic still counts.']] ] },
   fr: { intro: 'Noël arrive sur le serveur officiel de Wumi, et un outil pratique pour les modérateurs.', blocs: [
     ['Événement de Noël', ['Sur le serveur officiel de Wumi jusqu\'au 31 décembre : discute dans les salons de la communauté et un objet tombe de la neige. Ramasse-le le premier pour trouver un ☃️ bonhomme de neige (+1), un 🎁 cadeau (+3)… ou une vieille 🧦 chaussette (−1) !', 'Classement en direct avec <code>/noel classement</code>, et podium annoncé à la fin.']],
     ['Modération', ['<code>/snipe</code> : les derniers messages supprimés ou modifiés d\'un salon, gardés 10 minutes en mémoire seulement, visibles par le staff.']],
     ['Corrigé', ['Le temps en vocal est compté toutes les 5 minutes et survit aux redémarrages du bot ; micro coupé, ça compte quand même.']] ] } },
 { v: '2.10',
   en: { intro: 'Your stats as a shareable image, a companion that grows with you, and an easier way to find teammates.', blocs: [
     ['New', ['<code>/wrapped</code>: your personal recap as an image, this month or all time: messages, voice time, level, favorite channels, your peak hour and your "personality".', '<code>/pet</code>: adopt a companion (cat, fox, dragon, unicorn…). It grows from an egg to legendary as you chat; feed it, play with it, or it sulks.', '<code>/lfg</code>: looking for players? Post your game and the number of slots; once the group is full, Wumi creates a private voice channel for it.']],
     ['Support & status', ['Incidents and maintenance are now announced on the status page and in the status channel.', 'Permanent 24/7 radio that restarts on its own, and smarter support tickets.']] ] },
   fr: { intro: 'Tes stats en image à partager, un compagnon qui grandit avec toi, et une façon simple de trouver des coéquipiers.', blocs: [
     ['Nouveau', ['<code>/wrapped</code> : ton récap perso en image, ce mois-ci ou depuis le début : messages, temps en vocal, niveau, salons préférés, ton heure de pointe et ta « personnalité ».', '<code>/pet</code> : adopte un compagnon (chat, renard, dragon, licorne…). Il passe de l\'œuf au légendaire quand tu discutes ; nourris-le, joue avec lui, sinon il boude.', '<code>/lfg</code> : tu cherches des joueurs ? Annonce ton jeu et le nombre de places ; quand le groupe est complet, Wumi lui crée un vocal privé.']],
     ['Support & statut', ['Les incidents et maintenances sont annoncés sur la page de statut et dans le salon de statut.', 'Radio permanente 24/7 qui se relance toute seule, et tickets du support plus malins.']] ] } },
 { v: '2.8',
   en: { intro: 'Blind test, live radios and events: more reasons to hang out in your voice channels.', blocs: [
     ['New', ['<code>/blindtest</code>: Wumi plays a 25-second clip in voice, the first to type the title wins 2 points (the artist, 1 point). Hints, 6 themes and a final leaderboard.', '<code>/radio</code>: 13 live radios in one click (Lofi Girl, FIP, jazz, rock, electro, rap, hits, classical…). Pair it with 24/7 mode.', '<code>/event</code>: an evening or a tournament with sign-up buttons, limited slots, a waiting list and a reminder 15 minutes before.']],
     ['Improved', ['Music playback is more reliable on YouTube and Spotify links.']] ] },
   fr: { intro: 'Blind test, radios en direct et événements : encore plus de raisons de se retrouver en vocal.', blocs: [
     ['Nouveau', ['<code>/blindtest</code> : Wumi joue un extrait de 25 secondes dans le vocal, le premier qui écrit le titre gagne 2 points (l\'artiste, 1 point). Indices, 6 thèmes et classement final.', '<code>/radio</code> : 13 radios en direct en un clic (Lofi Girl, FIP, jazz, rock, électro, rap, hits, classique…). Parfait avec le mode 24/7.', '<code>/evenement</code> : une soirée ou un tournoi avec inscriptions par bouton, places limitées, liste d\'attente et rappel 15 minutes avant.']],
     ['Amélioré', ['La lecture de la musique est plus fiable, avec les liens YouTube et Spotify.']] ] } },
 { v: '2.7',
   en: { intro: 'Music arrives on Wumi: a full player, right in your voice channels.', blocs: [
     ['New', ['<code>/play</code>: YouTube search with suggestions as you type, plus YouTube, SoundCloud, Bandcamp, Twitch and radio links.', '<b>Spotify links</b>: tracks, albums and playlists, no account needed.', '<b>Interactive player</b>: previous, pause, skip, stop, loop, shuffle, volume, queue, and a progress bar that moves on its own.', '<b>Audio filters</b>: bass boost, nightcore, vaporwave, slowed, 8D, karaoke.']],
     ['Control', ['<code>/music</code>: queue, skip, previous, volume, loop, shuffle, remove, move, seek, clear.', '<b>DJ role</b> (optional): others vote to skip a track.', '<b>Server playlists</b>: save the queue, load it back anytime.', '<b>24/7 mode</b>, otherwise Wumi leaves after 3 minutes without music.']] ] },
   fr: { intro: 'La musique arrive sur Wumi : un lecteur complet, directement dans tes salons vocaux.', blocs: [
     ['Nouveau', ['<code>/jouer</code> : recherche YouTube avec suggestions pendant que tu tapes, et liens YouTube, SoundCloud, Bandcamp, Twitch et radios.', '<b>Liens Spotify</b> : titres, albums et playlists, sans compte.', '<b>Lecteur interactif</b> : précédent, pause, suivant, stop, boucle, mélange, volume, file, et une barre de progression qui avance toute seule.', '<b>Filtres audio</b> : bass boost, nightcore, vaporwave, slowed, 8D, karaoké.']],
     ['Contrôle', ['<code>/musique</code> : file, passer, précédent, volume, boucle, mélanger, retirer, déplacer, aller à un moment, vider.', '<b>Rôle DJ</b> (facultatif) : les autres votent pour passer une piste.', '<b>Playlists du serveur</b> : sauve la file, recharge-la quand tu veux.', '<b>Mode 24/7</b>, sinon Wumi part après 3 minutes sans musique.']] ] } },
 { v: '2.6',
   en: { intro: 'A full security check of your server, with one-click fixes.', blocs: [
     ['New', ['<code>/audit run</code>: 15 checks (dangerous @everyone permissions, admin bots, 2FA, verification level, private channels that leak, roles above Wumi, forgotten webhooks, logs, antiraid, automod…), a <b>score out of 100</b> and a <b>Fix</b> button when it\'s safe.', '<code>/audit weekly</code>: the report posted every week in a staff channel, with an alert if the score drops.']],
     ['Safety', ['Fixes never delete a role, a channel or a webhook.']] ] },
   fr: { intro: 'Un bilan de sécurité complet de ton serveur, avec corrections en un clic.', blocs: [
     ['Nouveau', ['<code>/audit lancer</code> : 15 vérifications (permissions dangereuses de @everyone, bots administrateurs, 2FA, niveau de vérification, salons privés qui fuient, rôles au-dessus de Wumi, webhooks oubliés, logs, antiraid, automod…), une <b>note sur 100</b> et un bouton <b>Corriger</b> quand c\'est sans risque.', '<code>/audit hebdo</code> : le bilan posté chaque semaine dans un salon staff, avec une alerte si la note baisse.']],
     ['Sécurité', ['Les corrections ne suppriment jamais de rôle, de salon ni de webhook.']] ] } },
 { v: '2.5',
   en: { intro: 'A brighter website, and a few things behind the scenes.', blocs: [
     ['Website', ['<b>Light theme</b> on wumi.fr, the commands page, the status page and the dashboard: use the ☀️/🌙 button, or let your device choose.', '<b>This page</b>: every update in one place.', '<b>An interactive demo</b> on the home page: try Wumi before adding it.']],

const T = {
  en: { une: 'Latest update', tout: 'All updates', cherche: 'Search an update…', lire: 'Read the details', vide: 'No update matches.',  eyebrow: "What's new", titre: 'Wumi keeps <span class="serif grad">growing.</span>', lead: 'Every update, explained simply. New commands can take up to an hour to show up in Discord.', pied: 'Thanks for using Wumi · ', retour: '← Site', accueil: '../' },
  fr: { une: 'Dernière mise à jour', tout: 'Toutes les mises à jour', cherche: 'Chercher une mise à jour…', lire: 'Lire le détail', vide: 'Aucune mise à jour ne correspond.', eyebrow: 'Nouveautés', titre: 'Wumi ne cesse <span class="serif grad">de grandir.</span>', lead: 'Chaque mise à jour, expliquée simplement. Les nouvelles commandes peuvent mettre jusqu\'à une heure à apparaître dans Discord.', pied: 'Merci d\'utiliser Wumi · ', retour: '← Site', accueil: '../fr/' },
};
let langue = 'en';
try { langue = new URLSearchParams(location.search).get('lang') || localStorage.getItem('wumi-lang') || (/^fr/i.test(navigator.language) ? 'fr' : 'en'); } catch (e) {}
if (!T[langue]) langue = 'en';
function rendre() {
  const t = T[langue];
  document.documentElement.lang = langue;
  document.title = 'Wumi · ' + t.eyebrow;
  document.getElementById('t-eyebrow').textContent = t.eyebrow;
  document.getElementById('t-titre').innerHTML = t.titre;
  document.getElementById('t-lead').textContent = t.lead;
  const r = document.getElementById('retour'); if (r) { r.textContent = t.retour; r.href = t.accueil; }
  const l = document.getElementById('lien-accueil'); if (l) l.href = t.accueil;
  document.querySelectorAll('[data-lang]').forEach((b) => b.classList.toggle('on', b.dataset.lang === langue));
  document.getElementById('t-pied').innerHTML = t.pied + '<a href="' + t.accueil + '">wumi.fr</a>';
  const fmt = (d) => d ? new Date(d + 'T12:00:00').toLocaleDateString(langue === 'fr' ? 'fr-FR' : 'en-US', { day: 'numeric', month: 'long', year: 'numeric' }) : '';
  const img = (x) => x.img ? (typeof x.img === 'string' ? x.img : x.img[langue]) : null;
  const id = (x) => 'v' + x.v.replace(/\./g, '-');
  const titre = (x) => x[langue].titre || ('Wumi ' + x.v);
  const a = V[0], ca = a[langue];
  document.getElementById('une').innerHTML = '<article class="une" style="--c:' + (a.couleur || '#ff9d1b') + '"><div class="une-txt">'
    + '<span class="une-pill"><i></i>' + t.une + ' · ' + a.v + '</span><h2>' + titre(a) + '</h2><p>' + ca.intro + '</p>'
    + '<div class="une-pts">' + (ca.points || []).map((pt) => '<div class="une-pt"><span>' + pt[0] + '</span><div>' + pt[1] + '</div></div>').join('') + '</div>'
    + '<p class="une-meta">' + fmt(a.date) + (a.date ? ' · ' : '') + '<a href="#' + id(a) + '">' + t.lire + ' ↓</a></p></div>'
    + '<div class="une-vis">' + (img(a) ? '<img src="' + img(a) + '" alt="">' : '<span class="gros">' + (a.ico || '✨') + '</span>') + '</div></article>';
  document.getElementById('recents').innerHTML = V.slice(1, 4).map((x) => '<a class="carte" href="#' + id(x) + '" style="--c:' + (x.couleur || '#ff9d1b') + '">'
    + '<div class="carte-vis">' + (img(x) ? '<img src="' + img(x) + '" alt="" loading="lazy">' : (x.ico || '✨')) + '</div>'
    + '<div class="carte-txt"><small>WUMI ' + x.v + (x.date ? ' · ' + fmt(x.date).toUpperCase() : '') + '</small><h3>' + titre(x) + '</h3><p>' + x[langue].intro + '</p></div></a>').join('');
  document.getElementById('t-tout').textContent = t.tout;
  const champ = document.getElementById('cherche'); champ.placeholder = t.cherche;
  const q = champ.value.trim().toLowerCase();
  const html = V.map((x) => {
    const c = x[langue];
    const corps = '<p>' + c.intro + '</p>' + c.blocs.map((b) => '<h3>' + b[0] + '</h3><ul>' + b[1].map((li) => '<li>' + li + '</li>').join('') + '</ul>').join('');
    if (q && !(x.v + ' ' + titre(x) + ' ' + corps.replace(/<[^>]+>/g, ' ')).toLowerCase().includes(q)) return '';
    return '<article class="version" id="' + id(x) + '" style="--c:' + (x.couleur || '#ff9d1b') + '"><div class="version-tete"><span class="num">' + x.v + '</span><h2>' + (x.ico ? x.ico + ' ' : '') + titre(x) + '</h2>' + (x.date ? '<time datetime="' + x.date + '">' + fmt(x.date) + '</time>' : '') + '</div>' + corps + '</article>';
  }).join('');
  document.getElementById('liste').innerHTML = html || '<p class="vide">' + t.vide + '</p>';
}
document.addEventListener('input', (e) => { if (e.target.id === 'cherche') rendre(); });
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-lang]');
  if (b) { langue = b.dataset.lang; try { localStorage.setItem('wumi-lang', langue); } catch (er) {} rendre(); }
});
rendre();
</script>
<script>document.addEventListener('click',function(e){var b=e.target.closest('.theme');if(!b)return;var t=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=t;try{localStorage.setItem('wumi-theme',t)}catch(_){}});</script>
